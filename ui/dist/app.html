<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trajectory Lens</title>
  <style>:root {
  color-scheme: light dark;
  --tl-bg: var(--color-background-primary, #ffffff);
  --tl-bg2: var(--color-background-secondary, #f6f8fa);
  --tl-bg3: var(--color-background-tertiary, #eaeef2);
  --tl-fg: var(--color-text-primary, #1f2328);
  --tl-fg2: var(--color-text-secondary, #59636e);
  --tl-fg3: var(--color-text-tertiary, #818b98);
  --tl-border: var(--color-border-primary, #d0d7de);
  --tl-border2: var(--color-border-secondary, #e1e4e8);
  --tl-info-bg: var(--color-background-info, #ddf4ff);
  --tl-info: var(--color-text-info, #0969da);
  --tl-ok-bg: var(--color-background-success, #dafbe1);
  --tl-ok: var(--color-text-success, #1a7f37);
  --tl-warn-bg: var(--color-background-warning, #fff8c5);
  --tl-warn: var(--color-text-warning, #9a6700);
  --tl-err-bg: var(--color-background-danger, #ffebe9);
  --tl-err: var(--color-text-danger, #cf222e);
  --tl-ring: var(--color-ring-primary, #0969da);
  --tl-font: var(--font-sans, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
  --tl-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
}

[data-theme="dark"] {
  --tl-bg: var(--color-background-primary, #0d1117);
  --tl-bg2: var(--color-background-secondary, #161b22);
  --tl-bg3: var(--color-background-tertiary, #21262d);
  --tl-fg: var(--color-text-primary, #e6edf3);
  --tl-fg2: var(--color-text-secondary, #9198a1);
  --tl-fg3: var(--color-text-tertiary, #6e7681);
  --tl-border: var(--color-border-primary, #30363d);
  --tl-border2: var(--color-border-secondary, #21262d);
  --tl-info-bg: var(--color-background-info, rgba(56, 139, 253, 0.15));
  --tl-info: var(--color-text-info, #58a6ff);
  --tl-ok-bg: var(--color-background-success, rgba(46, 160, 67, 0.15));
  --tl-ok: var(--color-text-success, #3fb950);
  --tl-warn-bg: var(--color-background-warning, rgba(187, 128, 9, 0.15));
  --tl-warn: var(--color-text-warning, #d29922);
  --tl-err-bg: var(--color-background-danger, rgba(248, 81, 73, 0.15));
  --tl-err: var(--color-text-danger, #f85149);
  --tl-ring: var(--color-ring-primary, #58a6ff);
}

* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  padding: 0;
  background: var(--tl-bg);
  color: var(--tl-fg);
  font-family: var(--tl-font);
  font-size: 12.5px;
  line-height: 1.45;
  height: 100%;
}

.tl-shell {
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--tl-bg);
}

/* Header & Toolbar */
.tl-header {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--tl-bg2);
  border-bottom: 1px solid var(--tl-border);
  padding: 8px 12px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.tl-header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  flex-wrap: wrap;
}

.tl-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
}

.tl-title {
  font-weight: 700;
  font-size: 14px;
  white-space: nowrap;
}

.tl-session-select {
  max-width: 280px;
  min-width: 140px;
  background: var(--tl-bg);
  color: var(--tl-fg);
  border: 1px solid var(--tl-border);
  border-radius: 6px;
  padding: 4px 8px;
  font-size: 12px;
  text-overflow: ellipsis;
}

.tl-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
}

.tl-btn {
  appearance: none;
  background: var(--tl-bg);
  color: var(--tl-fg);
  border: 1px solid var(--tl-border);
  border-radius: 6px;
  padding: 4px 9px;
  font-size: 11.5px;
  font-weight: 500;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
}

.tl-btn:hover {
  border-color: var(--tl-ring);
}

.tl-btn.active {
  background: var(--tl-info-bg);
  color: var(--tl-info);
  border-color: var(--tl-info);
}

.tl-btn.primary {
  background: var(--tl-info);
  color: #ffffff;
  border-color: var(--tl-info);
}

.tl-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

.tl-pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 999px;
  font-size: 10.5px;
  font-weight: 600;
  background: var(--tl-bg3);
  color: var(--tl-fg2);
  border: 1px solid var(--tl-border);
  white-space: nowrap;
}

.tl-pill.ok {
  background: var(--tl-ok-bg);
  color: var(--tl-ok);
  border-color: transparent;
}

.tl-pill.warn {
  background: var(--tl-warn-bg);
  color: var(--tl-warn);
  border-color: transparent;
}

.tl-pill.err {
  background: var(--tl-err-bg);
  color: var(--tl-err);
  border-color: transparent;
}

.tl-pill.info {
  background: var(--tl-info-bg);
  color: var(--tl-info);
  border-color: transparent;
}

/* Tabs */
.tl-tabs {
  display: flex;
  align-items: center;
  gap: 4px;
  overflow-x: auto;
  scrollbar-width: thin;
  padding-bottom: 2px;
}

.tl-tab {
  appearance: none;
  background: transparent;
  color: var(--tl-fg2);
  border: 1px solid transparent;
  border-radius: 6px;
  padding: 4px 10px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

.tl-tab:hover {
  color: var(--tl-fg);
  background: var(--tl-bg3);
}

.tl-tab.active {
  color: var(--tl-info);
  background: var(--tl-info-bg);
  border-color: transparent;
}

/* KPI Ribbon */
.tl-kpis {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(105px, 1fr));
  gap: 8px;
  padding: 8px 12px;
  background: var(--tl-bg);
  border-bottom: 1px solid var(--tl-border2);
}

.tl-kpi {
  background: var(--tl-bg2);
  border: 1px solid var(--tl-border2);
  border-radius: 7px;
  padding: 6px 9px;
}

.tl-kpi-label {
  font-size: 10.5px;
  color: var(--tl-fg2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tl-kpi-val {
  font-size: 15px;
  font-weight: 700;
  margin-top: 2px;
  font-variant-numeric: tabular-nums;
}

/* Main Workspace & Inspector Split */
.tl-workspace {
  flex: 1;
  display: flex;
  min-height: 0;
  position: relative;
}

.tl-main {
  flex: 1;
  min-width: 0;
  padding: 10px 12px 32px;
  overflow-y: auto;
}

.tl-inspector {
  width: 430px;
  max-width: 48vw;
  border-left: 1px solid var(--tl-border);
  background: var(--tl-bg2);
  display: flex;
  flex-direction: column;
  min-height: 0;
  position: sticky;
  top: 88px;
  height: calc(100vh - 88px);
}

.tl-inspector.empty {
  width: 310px;
}

@media (max-width: 720px) {
  .tl-workspace {
    flex-direction: column;
  }
  .tl-inspector {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    top: 18%;
    width: 100%;
    max-width: 100%;
    height: auto;
    z-index: 40;
    border-left: none;
    border-top: 2px solid var(--tl-ring);
    box-shadow: 0 -8px 28px rgba(0, 0, 0, 0.28);
  }
  .tl-inspector.empty {
    display: none;
  }
}

.tl-inspector-hd {
  padding: 8px 12px;
  border-bottom: 1px solid var(--tl-border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.tl-inspector-tabs {
  display: flex;
  gap: 4px;
  padding: 6px 10px;
  border-bottom: 1px solid var(--tl-border2);
  background: var(--tl-bg);
  overflow-x: auto;
}

.tl-inspector-body {
  flex: 1;
  overflow-y: auto;
  padding: 10px 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.tl-inspector-actions {
  padding: 8px 12px;
  border-top: 1px solid var(--tl-border);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  background: var(--tl-bg);
}

/* Banners & Cards */
.tl-banner {
  border: 1px solid var(--tl-border);
  background: var(--tl-bg2);
  border-radius: 8px;
  padding: 8px 12px;
  margin-bottom: 10px;
  font-size: 12px;
}

.tl-banner.info {
  background: var(--tl-info-bg);
  border-color: transparent;
}

.tl-banner.ok {
  background: var(--tl-ok-bg);
  border-color: transparent;
}

.tl-card {
  background: var(--tl-bg2);
  border: 1px solid var(--tl-border);
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 10px;
}

.tl-card-hd {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  font-weight: 600;
  margin-bottom: 8px;
}

/* Filter & Replay Bar */
.tl-toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
  margin-bottom: 10px;
}

.tl-input {
  flex: 1;
  min-width: 170px;
  background: var(--tl-bg);
  color: var(--tl-fg);
  border: 1px solid var(--tl-border);
  border-radius: 6px;
  padding: 5px 9px;
  font-size: 12px;
}

.tl-input:focus, .tl-session-select:focus {
  outline: 2px solid var(--tl-ring);
  outline-offset: -1px;
}

.tl-chip-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-bottom: 10px;
}

.tl-chip {
  appearance: none;
  background: var(--tl-bg2);
  color: var(--tl-fg2);
  border: 1px solid var(--tl-border);
  border-radius: 999px;
  padding: 2px 9px;
  font-size: 11px;
  cursor: pointer;
}

.tl-chip.active {
  background: var(--tl-info-bg);
  color: var(--tl-info);
  border-color: var(--tl-info);
  font-weight: 600;
}

.tl-replay-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  padding: 6px 10px;
  background: var(--tl-bg2);
  border: 1px solid var(--tl-border);
  border-radius: 8px;
  margin-bottom: 10px;
}

.tl-replay-bar input[type="range"] {
  flex: 1;
  min-width: 110px;
}

/* Turns & Steps */
.tl-turn {
  border: 1px solid var(--tl-border);
  border-radius: 8px;
  background: var(--tl-bg2);
  margin-bottom: 10px;
  overflow: hidden;
}

.tl-turn-hd {
  padding: 8px 11px;
  background: var(--tl-bg3);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  cursor: pointer;
  user-select: none;
}

.tl-turn-title {
  font-weight: 600;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.tl-turn-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
  font-size: 11px;
  color: var(--tl-fg2);
}

.tl-turn-plain {
  padding: 6px 11px;
  background: var(--tl-info-bg);
  color: var(--tl-fg);
  font-size: 11.5px;
  border-bottom: 1px solid var(--tl-border2);
}

.tl-step-row {
  padding: 7px 11px;
  border-top: 1px solid var(--tl-border2);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 4px;
  transition: background 0.1s ease;
}

.tl-step-row:hover {
  background: var(--tl-bg3);
}

.tl-step-row.selected {
  background: var(--tl-info-bg);
  box-shadow: inset 3px 0 0 var(--tl-ring);
}

.tl-step-row.replay-active {
  outline: 2px solid var(--tl-warn);
  outline-offset: -2px;
}

.tl-step-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.tl-step-left {
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
  flex-wrap: wrap;
}

.tl-step-idx {
  font-family: var(--tl-mono);
  font-size: 11px;
  font-weight: 700;
  color: var(--tl-fg2);
}

.tl-step-preview {
  font-size: 11.5px;
  color: var(--tl-fg2);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.tl-tool-indent {
  margin-left: 14px;
  border-left: 2px solid var(--tl-border);
}

.tl-cat-explore { border-left-color: #3b82f6; }
.tl-cat-edit { border-left-color: #10b981; }
.tl-cat-execute { border-left-color: #f59e0b; }
.tl-cat-agent { border-left-color: #8b5cf6; }
.tl-cat-mcp { border-left-color: #06b6d4; }
.tl-cat-err { border-left-color: var(--tl-err); }

.tl-pre {
  margin: 0;
  padding: 8px 10px;
  background: var(--tl-bg);
  border: 1px solid var(--tl-border);
  border-radius: 6px;
  font-family: var(--tl-mono);
  font-size: 11px;
  line-height: 1.45;
  white-space: pre-wrap;
  word-break: break-word;
  max-height: 360px;
  overflow: auto;
}

/* Graph Canvas */
.tl-graph-wrap {
  border: 1px solid var(--tl-border);
  border-radius: 8px;
  background: var(--tl-bg2);
  overflow: hidden;
  position: relative;
  height: 520px;
  touch-action: none;
}

.tl-graph-svg {
  width: 100%;
  height: 100%;
  cursor: grab;
  display: block;
}

.tl-graph-svg:active {
  cursor: grabbing;
}

/* Tables & Bars */
.tl-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11.5px;
}

.tl-table th, .tl-table td {
  text-align: left;
  padding: 6px 8px;
  border-bottom: 1px solid var(--tl-border2);
}

.tl-table th {
  color: var(--tl-fg2);
  font-weight: 600;
}

.tl-bar-track {
  height: 8px;
  background: var(--tl-bg3);
  border-radius: 999px;
  overflow: hidden;
}

.tl-bar-fill {
  height: 100%;
  background: var(--tl-info);
  border-radius: 999px;
}

.tl-waterfall-row {
  display: grid;
  grid-template-columns: 180px 1fr 70px;
  gap: 8px;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid var(--tl-border2);
}

@media (max-width: 560px) {
  .tl-waterfall-row {
    grid-template-columns: 120px 1fr 56px;
  }
}

.tl-wf-track {
  position: relative;
  height: 14px;
  background: var(--tl-bg3);
  border-radius: 4px;
}

.tl-wf-bar {
  position: absolute;
  top: 2px;
  height: 10px;
  border-radius: 3px;
  background: var(--tl-info);
  min-width: 4px;
}

.tl-glossary-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
  gap: 6px;
  margin-top: 6px;
}

.tl-glossary-item {
  background: var(--tl-bg);
  border: 1px solid var(--tl-border2);
  border-radius: 6px;
  padding: 6px 8px;
  font-size: 11px;
}

.tl-muted {
  color: var(--tl-fg2);
}

.tl-mono {
  font-family: var(--tl-mono);
}
</style>
</head>
